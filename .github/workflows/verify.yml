name: Verificar aplicación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias de la API
        run: npm ci

      - name: Ejecutar tests de la API
        run: npm test

      - name: Compilar la API
        run: npm run build

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Compilar el frontend
        run: npm run build
        working-directory: frontend
