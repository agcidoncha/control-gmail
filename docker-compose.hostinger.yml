services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_STORE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL en .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      BACKEND_URL: http://api:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: easypanel
      traefik.http.routers.asistente-comercial-http.rule: Host(`lab.thelocalhost.es`)
      traefik.http.routers.asistente-comercial-http.entrypoints: http
      traefik.http.routers.asistente-comercial-http.middlewares: asistente-comercial-https-redirect
      traefik.http.middlewares.asistente-comercial-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.asistente-comercial-https.rule: Host(`lab.thelocalhost.es`)
      traefik.http.routers.asistente-comercial-https.entrypoints: https
      traefik.http.routers.asistente-comercial-https.tls: "true"
      traefik.http.routers.asistente-comercial-https.tls.certresolver: letsencrypt
      traefik.http.services.asistente-comercial.loadbalancer.server.port: "4321"
    networks:
      - default
      - easypanel
    ports:
      - "4321:4321"

volumes:
  mysql_data:

networks:
  easypanel:
    external: true
