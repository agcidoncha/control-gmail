services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_STORE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL en .env}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      BACKEND_URL: http://api:3000
    depends_on:
      - api
    networks:
      - default
      - easypanel

  # Panel visual temporal para consultar la base de datos desde el navegador.
  # No se publica por puerto del VPS; se expone únicamente mediante un dominio
  # o ruta protegida configurada en EasyPanel.
  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - easypanel

volumes:
  mysql_data:

networks:
  easypanel:
    external: true
